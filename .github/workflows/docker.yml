name: Образ для сервера

# Собирается вместе с .exe: когда в main меняется номер версии в version.py.
# Образ: ghcr.io/digushok/postavka:latest и :X.Y.Z (для отката на прошлую версию).
on:
  push:
    branches: [main]
    paths: ["version.py", "Dockerfile", "requirements.txt", ".github/workflows/docker.yml"]
  workflow_dispatch:      # ручной запуск: Actions → «Образ для сервера» → Run workflow

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Тесты
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v

      - name: Версия
        run: |
          echo "VERSION=$(python -c 'from version import VERSION; print(VERSION)')" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # кеш слоёв: системные пакеты и библиотеки пересобираются, только когда меняются,
          # и серверу при обновлении достаётся скачать лишь слой с кодом (меньше 1 МБ)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=Поставки Ozon
